[package]
name = "kage-types"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Versioned wire types shared by Kage services"

[dependencies]
alloy-primitives = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
